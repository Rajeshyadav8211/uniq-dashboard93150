<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(136deg, white 5%, #2f4052 5%, #2f4052 95%, white 95%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      border: none;
      border-radius: 15px;
      padding: 2rem;
      background-color: #ffffff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .form-floating .form-control {
      padding-left: 2.5rem;
    }

    .form-btn-bx button {
      width: fit-content;
      padding: 8px 16px;
      font-size: 12px;
      color: #fff;
      background-color: #2f4052;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .form-check label {
      font-size: 12px;
    }

    .fogot-bx {
      font-size: 12px;
      text-decoration: none;
    }

    .btn-primary {
      background-color: #2f4153;
      border: none;
    }

    .btn-primary:hover {
      background-color: #38444f;
    }

    .text-center {
      color: #333;
    }

    .form-container {
      background: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 350px;
    }

    .form-floating {
      position: relative;
      margin-bottom: 30px;
    }

    .form-floating input {
      width: 100%;
      padding: 10px 10px 14px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .form-floating label {
      position: absolute;
      top: 39%;
      left: 10px;
      transform: translateY(-50%);
      font-size: 12px;
      color: #999;
      background: #ffffff;
      height: 40%;
      padding: 0px 4px;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .form-floating input:focus {
      border-color: #2f4052;
    }

    .form-floating label.active {
      top: 0;
      font-size: 12px;
      color: #2f4052;
    }

/* -----animated-------bubble------- */

    div .dot {
      height: 60px;
      width: 60px;
      border-radius: 50px;
      background: rgb(255 255 255 / 25%);
      position: absolute;
      top: 20%;
      right: 10%;
  
    }
    div .dot1 {
      height: 60px;
      width: 60px;
      border-radius: 50px;
      background: rgb(255 255 255 / 25%);
      position: absolute;
      bottom: 20%;
      left: 10%;
     
    }

    /* ----End-animated-------bubble------- */
  </style>
</head>

<body>

  <div><span class="dot"></span></div>
 

  <div class="card" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">Master Admin Panel</h2>
    <p class="text-center mb-4">Please login to your account</p>
    <form id="loginForm" autocomplete="off">
      <!-- Email Input -->
      <div class="form-floating">
        <input type="email" id="email" autocomplete="off" required="" readonly
          onfocus="this.removeAttribute('readonly');">
        <label for="email" class="">Email Address <span class="text-danger">*</span></label>
        <p id="emailError" class="error"></p>
      </div>

      <!-- Password Input -->
      <div class="form-floating">
        <input type="password" id="password" autocomplete="off" required="">
        <label for="password" class="">Password <span class="text-danger">*</span></label>
        <p id="passwordError" class="error"></p>
      </div>

      <!-- Remember Me and Forgot Password -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember Me</label>
        </div>
        <a href="#" class="fogot-bx text-primary">Forgot Password?</a>
      </div>

      <!-- Submit Button -->
      <div class="form-btn-bx">
        <button type="submit" class="w-100">Login</button>
      </div>
    </form>

    <!-- <div class="text-center mt-3">
      <p>Don't have an account? <a href="#" class="text-primary">Sign up</a></p>
    </div> -->
  </div>


  <div><span class="dot1"></span></div>


  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script>
  //-------Using this input form----------
  document.addEventListener("DOMContentLoaded", function () {
    const inputs = document.querySelectorAll('.form-floating input');

    inputs.forEach(input => {
      input.addEventListener('focus', function () {
        this.nextElementSibling.classList.add('active');
      });

      input.addEventListener('blur', function () {
        if (this.value === "") {
          this.nextElementSibling.classList.remove('active');
        }
      });
    });
  });
</script>

</html>
